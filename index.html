<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Exploration Quiz</title>
    <style>
      :root {
        --bg: #f4f7ff;
        --panel: rgba(255, 255, 255, 0.78);
        --panel-strong: #ffffff;
        --text: #101828;
        --muted: #475467;
        --accent: #5b6cff;
        --accent-2: #7c3aed;
        --correct: #1daf6a;
        --wrong: #e74c3c;
        --selected: #5eead4;
        --selection-glow: rgba(94, 234, 212, 0.35);
        --shadow: rgba(60, 80, 150, 0.14);
        --progress: linear-gradient(90deg, #5b6cff 0%, #8b5cf6 50%, #2dd4bf 100%);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #09111f;
          --panel: rgba(15, 23, 42, 0.84);
          --panel-strong: #0f172a;
          --text: #e5ecff;
          --muted: #b1c0df;
          --accent: #8ea6ff;
          --accent-2: #b28cff;
          --correct: #34d399;
          --wrong: #fb7185;
          --selected: #67e8f9;
          --selection-glow: rgba(103, 232, 249, 0.3);
          --shadow: rgba(3, 7, 18, 0.48);
          --progress: linear-gradient(90deg, #7c8dff 0%, #a78bfa 55%, #34d399 100%);
        }
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(91, 108, 255, 0.18), transparent 30%),
          radial-gradient(circle at bottom right, rgba(45, 212, 191, 0.16), transparent 30%),
          var(--bg);
        color: var(--text);
        font-size: 15px;
      }

      body {
        display: grid;
        place-items: center;
        padding: 32px 18px;
      }

      .app {
        width: min(100%, 520px);
        min-height: 700px;
        background: var(--panel);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 26px;
        box-shadow: 0 26px 70px var(--shadow);
        position: relative;
        overflow: hidden;
      }

      .starfield {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        opacity: 0.82;
        background-image:
          radial-gradient(1.5px 1.5px at 8% 18%, rgba(255,255,255,0.95), transparent 60%),
          radial-gradient(1.5px 1.5px at 34% 28%, rgba(167,139,250,0.8), transparent 60%),
          radial-gradient(1.5px 1.5px at 64% 12%, rgba(255,255,255,0.9), transparent 60%),
          radial-gradient(1.6px 1.6px at 82% 32%, rgba(103,232,249,0.9), transparent 60%),
          radial-gradient(1.5px 1.5px at 18% 62%, rgba(255,255,255,0.8), transparent 60%),
          radial-gradient(1.6px 1.6px at 46% 72%, rgba(191,219,254,0.9), transparent 60%),
          radial-gradient(1.5px 1.5px at 72% 58%, rgba(255,255,255,0.9), transparent 60%),
          radial-gradient(1.5px 1.5px at 90% 76%, rgba(167,139,250,0.8), transparent 60%);
        background-repeat: repeat;
        background-size: 220px 220px;
        animation: starPulse 10s ease-in-out infinite alternate;
      }

      @keyframes starPulse {
        0% { opacity: 0.5; transform: scale(1); }
        50% { opacity: 0.82; transform: scale(1.02); }
        100% { opacity: 0.7; transform: scale(1); }
      }

      @media (prefers-reduced-motion: reduce) {
        .starfield {
          animation: none;
        }
      }

      .screen {
        position: relative;
        z-index: 1;
        padding: 22px 22px 24px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
        gap: 16px;
      }

      .brand {
        font-size: 0.8rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 700;
      }

      .score {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(91, 108, 255, 0.12);
        border: 1px solid rgba(91, 108, 255, 0.18);
        color: var(--text);
        font-weight: 700;
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 0.85rem;
      }

      .progress-wrap {
        margin-bottom: 18px;
      }

      .progress-meta {
        display: flex;
        justify-content: space-between;
        font-size: 0.8rem;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .progress-track {
        width: 100%;
        height: 12px;
        background: rgba(148, 163, 184, 0.15);
        border-radius: 999px;
        overflow: hidden;
        box-shadow: inset 0 0 0 1px rgba(148,163,184,0.08);
      }

      .progress-bar {
        height: 100%;
        width: 0%;
        border-radius: inherit;
        background: var(--progress);
        box-shadow: 0 8px 20px rgba(91, 108, 255, 0.3);
        transition: width 0.35s ease;
      }

      .question-panel {
        padding-top: 10px;
      }

      .category {
        display: inline-block;
        padding: 7px 12px;
        background: linear-gradient(135deg, rgba(91, 108, 255, 0.15), rgba(45, 212, 191, 0.12));
        border: 1px solid rgba(91, 108, 255, 0.2);
        border-radius: 999px;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .question {
        margin-top: 18px;
        font-size: clamp(1.4rem, 2.4vw, 2rem);
        line-height: 1.3;
        font-weight: 800;
        letter-spacing: -0.03em;
      }

      .answers {
        margin-top: 26px;
        display: grid;
        gap: 12px;
      }

      .answer {
        position: relative;
        width: 100%;
        border: 1px solid rgba(148, 163, 184, 0.32);
        background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(148,163,184,0.04));
        color: var(--text);
        border-radius: 16px;
        padding: 16px 18px 16px 46px;
        text-align: left;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        overflow: hidden;
        isolation: isolate;
        transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      }

      .answer::before {
        content: "";
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 2px solid rgba(148, 163, 184, 0.6);
        background: rgba(255,255,255,0.12);
        box-shadow: inset 0 0 0 2px rgba(255,255,255,0.2);
      }

      .answer::after {
        content: "";
        position: absolute;
        inset: 0 auto auto 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(120deg, rgba(94, 234, 212, 0.12), transparent 35%, transparent 60%, rgba(91, 108, 255, 0.12));
        opacity: 0;
        transition: opacity 0.2s ease;
      }

      .answer:hover {
        transform: translateY(-1px);
        border-color: rgba(91, 108, 255, 0.45);
        box-shadow: 0 12px 18px rgba(91, 108, 255, 0.08);
      }

      .answer:hover::after,
      .answer:focus-visible::after,
      .answer.selected::after {
        opacity: 1;
      }

      .answer:disabled {
        cursor: default;
      }

      .answer:focus-visible,
      .next-btn:focus-visible,
      .play-again:focus-visible {
        outline: 3px solid rgba(94, 234, 212, 0.9);
        outline-offset: 3px;
        box-shadow: 0 0 0 5px rgba(94, 234, 212, 0.22), 0 0 0 10px rgba(91, 108, 255, 0.1);
      }

      .answer:focus-visible {
        border-color: rgba(94, 234, 212, 0.95);
      }

      .next-btn:focus-visible, .play-again:focus-visible {
        outline-offset: 4px;
      }

      .answer.correct {
        background: rgba(29, 175, 106, 0.12);
        border-color: rgba(29, 175, 106, 0.8);
        color: var(--correct);
        box-shadow: 0 0 0 1px rgba(29, 175, 106, 0.24), 0 0 18px rgba(29, 175, 106, 0.12);
      }

      .answer.correct::before {
        border-color: rgba(29, 175, 106, 0.9);
        background: rgba(29, 175, 106, 0.3);
      }

      .answer.wrong {
        background: rgba(231, 76, 60, 0.10);
        border-color: rgba(231, 76, 60, 0.8);
        color: var(--wrong);
        box-shadow: 0 0 0 1px rgba(231, 76, 60, 0.22), 0 0 18px rgba(231, 76, 60, 0.12);
      }

      .answer.wrong::before {
        border-color: rgba(231, 76, 60, 0.9);
        background: rgba(231, 76, 60, 0.2);
      }

      .answer.selected {
        border-color: rgba(94, 234, 212, 0.9);
        box-shadow: 0 0 0 1px rgba(94, 234, 212, 0.4), 0 12px 22px var(--selection-glow), inset 0 0 18px rgba(94, 234, 212, 0.12);
      }

      .answer.selected::before {
        border-color: var(--selected);
        background: rgba(94, 234, 212, 0.22);
        box-shadow: 0 0 0 3px rgba(94, 234, 212, 0.12), inset 0 0 0 3px rgba(94, 234, 212, 0.2);
      }

      .shake {
        animation: shake 0.42s ease-in-out;
      }

      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-8px); }
        40% { transform: translateX(8px); }
        60% { transform: translateX(-6px); }
        80% { transform: translateX(6px); }
      }

      .feedback {
        margin-top: 22px;
        min-height: 32px;
        font-size: 1.02rem;
        font-weight: 700;
        opacity: 0;
        transform: translateY(8px);
        transition: opacity 0.2s ease, transform 0.2s ease;
      }

      .feedback.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .feedback.correct {
        color: var(--correct);
      }

      .feedback.wrong {
        color: var(--wrong);
      }

      .next-btn,
      .play-again {
        appearance: none;
      }

      .next-btn {
        display: none;
        width: 100%;
        border: 0;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: white;
        margin-top: 18px;
        padding: 14px 18px;
        font: inherit;
        font-weight: 800;
        letter-spacing: 0.02em;
        cursor: pointer;
        box-shadow: 0 16px 28px rgba(91, 108, 255, 0.25);
      }

      .result-wrap {
        display: none;
        text-align: center;
        padding: 18px 8px 10px;
      }

      .result-wrap.visible {
        display: block;
      }

      .result-wrap.celebration {
        background: linear-gradient(180deg, rgba(94,234,212,0.08), rgba(91,108,255,0.04));
        border-radius: 18px;
      }

      .result-wrap.celebration .reaction {
        filter: drop-shadow(0 0 18px rgba(94, 234, 212, 0.5));
        animation: floatUp 1.8s ease-in-out infinite alternate;
      }

      @keyframes floatUp {
        0% { transform: translateY(0); }
        100% { transform: translateY(-8px); }
      }

      @media (prefers-reduced-motion: reduce) {
        .result-wrap.celebration .reaction {
          animation: none;
        }
      }

      .reaction {
        font-size: clamp(3rem, 8vw, 5rem);
        margin: 18px 0 8px;
      }

      .result-title {
        margin: 0;
        font-size: clamp(1.8rem, 4vw, 2.5rem);
        letter-spacing: -0.05em;
      }

      .result-score {
        margin-top: 14px;
        font-size: clamp(1.1rem, 2vw, 1.4rem);
        color: var(--muted);
        font-weight: 700;
      }

      .result-score strong {
        color: var(--text);
      }

      .result-message {
        margin-top: 18px;
        font-size: 1rem;
        line-height: 1.6;
        color: var(--muted);
        max-width: 36ch;
        margin-left: auto;
        margin-right: auto;
      }

      .play-again {
        width: 100%;
        border: none;
        border-radius: 16px;
        background: linear-gradient(135deg, #111827, #334155);
        color: white;
        padding: 14px 18px;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        margin-top: 22px;
      }

      @media (max-width: 420px) {
        .screen {
          padding-left: 18px;
          padding-right: 18px;
        }

        .topbar {
          margin-bottom: 14px;
        }

        .answer {
          padding: 14px 14px 14px 42px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app" aria-live="polite">
      <div class="starfield" aria-hidden="true"></div>
      <div class="screen quiz-screen">
        <header class="topbar">
          <div class="brand">Space Quiz</div>
          <div class="score">Score <span id="score">0</span></div>
        </header>

        <div class="progress-wrap">
          <div class="progress-meta">
            <span>Progress</span>
            <span id="progress-label">1 / 10</span>
          </div>
          <div class="progress-track" aria-label="Quiz progress">
            <div class="progress-bar" id="progress-bar"></div>
          </div>
        </div>

        <section class="question-panel">
          <div class="category" id="category">Astronomy</div>
          <h1 class="question" id="question">Question text</h1>
          <div class="answers" id="answers"></div>
          <div class="feedback" id="feedback" aria-live="polite"></div>
          <button class="next-btn" id="next-btn" type="button">Next</button>
        </section>
      </div>

      <div class="screen result-wrap" id="result-screen">
        <div class="reaction" id="reaction">🚀</div>
        <h2 class="result-title" id="result-title">Mission Complete!</h2>
        <div class="result-score"><strong id="final-score">0</strong> / 10 correct</div>
        <p class="result-message" id="result-message"></p>
        <button class="play-again" id="play-again" type="button">Play Again</button>
      </div>
    </main>

    <script>
      const questions = [
        {
          category: 'Astronomy',
          question: 'Which planet is known as the Red Planet?',
          answers: ['Venus', 'Mars', 'Jupiter', 'Mercury'],
          correct: 1,
        },
        {
          category: 'Solar System',
          question: 'What is the name of Earth\'s natural satellite?',
          answers: ['Titan', 'Europa', 'Titania', 'Moon'],
          correct: 3,
        },
        {
          category: 'Spacecraft',
          question: 'Which spacecraft was the first to land humans on the Moon?',
          answers: ['Apollo 11', 'Voyager 1', 'Sputnik 1', 'Hubble'],
          correct: 0,
        },
        {
          category: 'Stars',
          question: 'What is the brightest star in the night sky from Earth?',
          answers: ['Betelgeuse', 'Polaris', 'Sirius', 'Rigel'],
          correct: 2,
        },
        {
          category: 'Galaxies',
          question: 'Which galaxy is the Milky Way\'s closest major galactic neighbor?',
          answers: ['Andromeda', 'Whirlpool', 'Sombrero', 'Triangulum'],
          correct: 0,
        },
        {
          category: 'Science',
          question: 'What force keeps planets in orbit around the Sun?',
          answers: ['Magnetism', 'Centrifugal force', 'Gravity', 'Radiation'],
          correct: 2,
        },
        {
          category: 'Exploration',
          question: 'Which rover was sent to Mars in 2021 to search for signs of past life?',
          answers: ['Opportunity', 'Perseverance', 'Spirit', 'Curiosity'],
          correct: 1,
        },
        {
          category: 'Cosmos',
          question: 'The asteroid belt is located between which two planets?',
          answers: ['Earth and Mars', 'Mars and Jupiter', 'Jupiter and Saturn', 'Venus and Earth'],
          correct: 1,
        },
        {
          category: 'Moon',
          question: 'What causes the phases of the Moon?',
          answers: ['The Earth\'s shadow', 'The Moon rotating rapidly', 'The Sun illuminating different portions of the Moon as it orbits Earth', 'The Moon passing through clouds'],
          correct: 2,
        },
        {
          category: 'Universe',
          question: 'What is a light-year?',
          answers: ['A year with unusually bright sunlight', 'The distance light travels in one year', 'The time a star takes to burn out', 'A unit of time used by astronauts'],
          correct: 1,
        },
      ];

      const quizScreen = document.querySelector('.quiz-screen');
      const resultScreen = document.getElementById('result-screen');
      const scoreEl = document.getElementById('score');
      const progressBar = document.getElementById('progress-bar');
      const progressLabel = document.getElementById('progress-label');
      const categoryEl = document.getElementById('category');
      const questionEl = document.getElementById('question');
      const answersEl = document.getElementById('answers');
      const feedbackEl = document.getElementById('feedback');
      const nextBtn = document.getElementById('next-btn');
      const reactionEl = document.getElementById('reaction');
      const resultTitleEl = document.getElementById('result-title');
      const finalScoreEl = document.getElementById('final-score');
      const resultMessageEl = document.getElementById('result-message');
      const playAgainBtn = document.getElementById('play-again');

      let currentIndex = 0;
      let score = 0;
      let answered = false;

      function shuffle(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function updateProgress() {
        const progress = ((currentIndex + (answered ? 1 : 0)) / questions.length) * 100;
        progressBar.style.width = `${progress}%`;
        progressLabel.textContent = `${Math.min(currentIndex + 1, questions.length)} / ${questions.length}`;
      }

      function getReaction(scoreValue) {
        if (scoreValue === 10) return { emoji: '🚀', title: 'Galactic Genius!', message: 'You nailed the entire mission. The cosmos is officially your playground.' };
        if (scoreValue >= 8) return { emoji: '👽', title: 'Excellent Orbit!', message: 'You are a true space explorer. A few more missions and you will be leading the launch team.' };
        if (scoreValue >= 6) return { emoji: '🌙', title: 'Solid Explorer!', message: 'Nice work. You have a strong grasp of the universe and a bright orbit ahead.' };
        if (scoreValue >= 4) return { emoji: '🪐', title: 'Good Try!', message: 'You made it through the galaxy with some stellar answers. Keep exploring the stars.' };
        if (scoreValue >= 2) return { emoji: '🌌', title: 'Boost Your Orbit!', message: 'A little more practice and you will be charting your own constellation course.' };
        return { emoji: '🛰️', title: 'Mission in Progress!', message: 'Every space traveler starts somewhere. Try another round and watch your knowledge grow.' };
      }

      function renderQuestion() {
        answered = false;
        nextBtn.style.display = 'none';
        feedbackEl.textContent = '';
        feedbackEl.className = 'feedback';
        answersEl.innerHTML = '';

        const question = questions[currentIndex];
        categoryEl.textContent = question.category;
        questionEl.textContent = question.question;

        const shuffled = shuffle(question.answers).map((answer) => ({ answer, originalIndex: question.answers.indexOf(answer) }));

        shuffled.forEach(({ answer, originalIndex }) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'answer';
          button.textContent = answer;
          button.dataset.correct = String(originalIndex === question.correct);
          button.setAttribute('aria-pressed', 'false');
          button.setAttribute('aria-label', `Answer: ${answer}`);
          button.addEventListener('click', () => handleAnswer(button, originalIndex));
          answersEl.appendChild(button);
        });

        updateProgress();
      }

      function handleAnswer(button, selectedIndex) {
        if (answered) return;
        answered = true;

        const currentQuestion = questions[currentIndex];
        const buttons = Array.from(answersEl.querySelectorAll('.answer'));
        buttons.forEach((btn) => {
          btn.disabled = true;
          btn.setAttribute('aria-pressed', btn === button ? 'true' : 'false');
          const isCorrect = btn.dataset.correct === 'true';
          if (isCorrect) {
            btn.classList.add('correct');
          }
        });

        const isCorrect = selectedIndex === currentQuestion.correct;
        if (isCorrect) {
          score += 1;
          scoreEl.textContent = score;
          button.classList.add('selected', 'correct');
          button.setAttribute('aria-pressed', 'true');
          feedbackEl.textContent = 'Correct! Great job!';
          feedbackEl.classList.add('correct', 'visible');
        } else {
          button.classList.add('selected', 'wrong', 'shake');
          button.setAttribute('aria-pressed', 'true');
          const correctButton = buttons.find((btn) => btn.dataset.correct === 'true');
          if (correctButton) {
            correctButton.classList.add('correct');
          }
          feedbackEl.textContent = `Not quite — the answer was “${currentQuestion.answers[currentQuestion.correct]}”.`;
          feedbackEl.classList.add('wrong', 'visible');
        }

        nextBtn.style.display = 'block';
      }

      function showResults() {
        quizScreen.style.display = 'none';
        resultScreen.classList.add('visible');
        resultScreen.classList.toggle('celebration', score >= 8);

        const reaction = getReaction(score);
        reactionEl.textContent = reaction.emoji;
        resultTitleEl.textContent = reaction.title;
        finalScoreEl.textContent = score;
        resultMessageEl.textContent = reaction.message;
      }

      function nextQuestion() {
        currentIndex += 1;
        if (currentIndex < questions.length) {
          renderQuestion();
        } else {
          showResults();
        }
      }

      function resetQuiz() {
        currentIndex = 0;
        score = 0;
        answered = false;
        scoreEl.textContent = '0';
        quizScreen.style.display = 'block';
        resultScreen.classList.remove('visible');
        resultScreen.classList.remove('celebration');
        renderQuestion();
      }

      nextBtn.addEventListener('click', nextQuestion);
      playAgainBtn.addEventListener('click', resetQuiz);

      renderQuestion();
    </script>
  </body>
</html>
